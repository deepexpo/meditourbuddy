# MediTourBuddy Gateway — Fly.io configuration
# Deploy from the monorepo root so Docker can reach both gateway/ and packages/.
# Usage: fly deploy  (run from the repo root)
app = "meditourbuddy-gateway"
primary_region = "yyz"   # Toronto — closest to your Canadian users + Supabase ca-central-1

[build]
  # Dockerfile lives in gateway/ but the build context must be the monorepo
  # root so the multi-stage build can reach packages/clinic-registry-mcp/.
  dockerfile = "gateway/Dockerfile"

[env]
  # Non-secret runtime config. Secrets (JWT_SECRET, ANTHROPIC_API_KEY,
  # DATABASE_URL) must be set via:  fly secrets set KEY=value
  ALLOWED_ORIGINS = "https://meditourbuddy-gateway.fly.dev"

[http_service]
  internal_port = 8000
  force_https   = true

  # Spin down when idle to save cost on the free tier.
  # The MCP subprocess reconnects automatically on the next cold start.
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    # /health reports mcp_connected + db_connected — fail fast on startup issues.
    grace_period = "20s"
    interval     = "30s"
    timeout      = "10s"
    method       = "GET"
    path         = "/health"

[[vm]]
  # 512 MB is comfortable for Python + Claude agent responses.
  # Upgrade to 1 GB if you add streaming or concurrent agent runs.
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
